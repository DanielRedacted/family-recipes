services:
  recipe-app:
    build: .
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./recipes.db:/app/recipes.db
      - ./uploads:/app/uploads
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  caddy:
    image: caddy:latest
    ports:
      - "80:80"
      - "443:443"
      - "2019:2019"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - recipe-app
    restart: unless-stopped

volumes:
  ollama_data:
  caddy_data:
  caddy_config:
