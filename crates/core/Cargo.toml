[package]
name = "recipes-core"
edition.workspace = true
version.workspace = true

[[bin]]
name = "recipes-server"
path = "src/bin/recipes-server.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br", "trace"] }
rust-embed = "8"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
pulldown-cmark = { version = "0.13", default-features = false }
walkdir = "2"
notify = "8"
notify-debouncer-full = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
unicode-normalization = "0.1"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
regex = "1"
strsim = "0.11"
rand = "0.9"
base64 = "0.22"
hmac = "0.12"
argon2 = "0.5"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
if-addrs = "0.15"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
time = "0.3"
scraper = "0.24"
dom_smoothie = "0.19"
htmd = "0.5"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "brotli", "stream", "json"] }
url = "2"
pdf-extract = "0.10"
keyring = { version = "3", features = ["apple-native"] }
# vendored-openssl: libgit2-sys calls OpenSSL init on macOS too (TLS itself goes through SecureTransport); static so nothing needs installing
git2 = { version = "0.21.0", default-features = false, features = ["https", "vendored-libgit2", "vendored-openssl"] }
